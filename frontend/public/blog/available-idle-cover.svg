<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgAI" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A1F3A"/>
      <stop offset="1" stop-color="#1A4D8F"/>
    </linearGradient>
    <radialGradient id="glowAI" cx="50%" cy="38%" r="55%">
      <stop offset="0" stop-color="#4DA3FF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#4DA3FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgAI)"/>
  <circle cx="600" cy="230" r="280" fill="url(#glowAI)"/>
  <circle cx="600" cy="300" r="230" stroke="#FFFFFF" stroke-width="1" opacity="0.08" fill="none"/>
  <circle cx="600" cy="300" r="150" stroke="#FFFFFF" stroke-width="1" opacity="0.12" fill="none"/>

  <!-- Available: active pulse -->
  <g transform="translate(440, 260)">
    <circle r="60" fill="#0A1F3A" stroke="#7ED957" stroke-width="4"/>
    <circle r="78" fill="none" stroke="#7ED957" stroke-width="2" opacity="0.4"/>
    <circle r="96" fill="none" stroke="#7ED957" stroke-width="1.5" opacity="0.2"/>
    <text x="0" y="7" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" fill="#7ED957" font-weight="700">READY</text>
  </g>

  <!-- Idle: static, faded, dashed -->
  <g transform="translate(780, 260)">
    <circle r="60" fill="#132C52" stroke="#8CC2FF" stroke-width="3" stroke-dasharray="7 6" opacity="0.6"/>
    <text x="0" y="7" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" fill="#8CC2FF" font-weight="700" opacity="0.7">IDLE</text>
  </g>

  <g transform="translate(460, 480)">
    <rect x="0" y="0" width="280" height="70" rx="14" fill="#132C52" stroke="#4DA3FF" stroke-width="2"/>
    <text x="140" y="30" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#8CC2FF" letter-spacing="1">IDLE THRESHOLD</text>
    <text x="140" y="56" text-anchor="middle" font-family="Inter, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">200 hours</text>
  </g>
</svg>
