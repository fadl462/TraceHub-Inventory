    <text x="0" y="10" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#8CC2FF">COMPANY</text>
    <text x="0" y="28" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#8CC2FF">ADMIN</text>
  </g>

  <g transform="translate(460, 470)">
