<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgEPR" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A1F3A"/>
      <stop offset="1" stop-color="#1A4D8F"/>
    </linearGradient>
    <radialGradient id="glowEPR" cx="50%" cy="38%" r="55%">
      <stop offset="0" stop-color="#4DA3FF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#4DA3FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgEPR)"/>
  <circle cx="600" cy="230" r="280" fill="url(#glowEPR)"/>
  <circle cx="600" cy="300" r="230" stroke="#FFFFFF" stroke-width="1" opacity="0.08" fill="none"/>
  <circle cx="600" cy="300" r="150" stroke="#FFFFFF" stroke-width="1" opacity="0.12" fill="none"/>

  <!-- Recycling arrows triangle -->
  <g transform="translate(600, 250)">
    <path d="M -20 -70 L 20 -70 L 40 -35 L 0 -35 Z" fill="#132C52" stroke="#7ED957" stroke-width="3"/>
    <path d="M 55 30 L 35 65 L 70 65 L 90 100 L 110 65 L 90 65 Z" fill="#132C52" stroke="#7ED957" stroke-width="3" transform="rotate(120 55 30)"/>
    <path d="M -55 30 L -75 65 L -110 65 L -90 100" fill="none" stroke="#7ED957" stroke-width="3" transform="rotate(-120 -55 30)"/>
    <circle r="95" fill="none" stroke="#8CC2FF" stroke-width="2" opacity="0.3"/>
  </g>

  <!-- Document trail, small badge -->
  <g transform="translate(770, 340)">
    <rect x="-40" y="-30" width="80" height="60" rx="8" fill="#0A1F3A" stroke="#8CC2FF" stroke-width="3"/>
    <line x1="-25" y1="-10" x2="25" y2="-10" stroke="#8CC2FF" stroke-width="3" opacity="0.6"/>
    <line x1="-25" y1="5" x2="25" y2="5" stroke="#8CC2FF" stroke-width="3" opacity="0.6"/>
    <line x1="-25" y1="20" x2="10" y2="20" stroke="#8CC2FF" stroke-width="3" opacity="0.6"/>
  </g>

  <g transform="translate(460, 480)">
