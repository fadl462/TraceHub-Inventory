<svg viewBox="0 0 1100 460" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="panelBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E2647"/>
      <stop offset="1" stop-color="#0A1F3A"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="460" rx="20" fill="url(#panelBg)"/>

  <!-- Title -->
  <text x="550" y="46" text-anchor="middle" font-family="Inter, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">
    Same generator, two very different usage stories
  </text>
  <text x="550" y="70" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#8CC2FF" opacity="0.8">
    Straight-line assumes identical wear every year - real usage rarely agrees
  </text>

  <!-- Axes -->
  <line x1="120" y1="110" x2="120" y2="380" stroke="#3D5D8A" stroke-width="1.5"/>
  <line x1="120" y1="380" x2="980" y2="380" stroke="#3D5D8A" stroke-width="1.5"/>
  <text x="90" y="115" text-anchor="end" font-family="Inter, sans-serif" font-size="12" fill="#8CC2FF">Value</text>
  <text x="980" y="405" text-anchor="end" font-family="Inter, sans-serif" font-size="12" fill="#8CC2FF">Years</text>

  <!-- Straight-line reference (dashed, even decline) -->
  <path d="M 120 130 L 980 350" fill="none" stroke="#5A7DAE" stroke-width="2.5" stroke-dasharray="7 6"/>

  <!-- Light-duty actual curve (declines slower than straight-line) -->
  <path d="M 120 130 L 330 175 L 550 210 L 760 245 L 980 275" fill="none" stroke="#7ED957" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Heavy-duty actual curve (declines faster than straight-line) -->
  <path d="M 120 130 L 330 220 L 550 290 L 760 335 L 980 360" fill="none" stroke="#FF8A65" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- End point labels -->
  <circle cx="980" cy="275" r="6" fill="#0A1F3A" stroke="#7ED957" stroke-width="3"/>
  <circle cx="980" cy="360" r="6" fill="#0A1F3A" stroke="#FF8A65" stroke-width="3"/>

  <!-- Legend -->
  <g transform="translate(150, 415)">
    <line x1="0" y1="0" x2="26" y2="0" stroke="#5A7DAE" stroke-width="2.5" stroke-dasharray="6 5"/>
    <text x="34" y="4" font-family="Inter, sans-serif" font-size="13" fill="#B9CEE8">Straight-line estimate</text>

    <line x1="270" y1="0" x2="296" y2="0" stroke="#7ED957" stroke-width="3.5"/>
    <text x="304" y="4" font-family="Inter, sans-serif" font-size="13" fill="#B9CEE8">Light duty, well maintained</text>

    <line x1="600" y1="0" x2="626" y2="0" stroke="#FF8A65" stroke-width="3.5"/>
    <text x="634" y="4" font-family="Inter, sans-serif" font-size="13" fill="#B9CEE8">Heavy duty, harsh environment</text>
  </g>
</svg>
