<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgEF" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A1F3A"/>
      <stop offset="1" stop-color="#1A4D8F"/>
    </linearGradient>
    <radialGradient id="glowEF" cx="50%" cy="38%" r="55%">
      <stop offset="0" stop-color="#4DA3FF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#4DA3FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgEF)"/>
  <circle cx="600" cy="230" r="280" fill="url(#glowEF)"/>
  <circle cx="600" cy="300" r="230" stroke="#FFFFFF" stroke-width="1" opacity="0.08" fill="none"/>
  <circle cx="600" cy="300" r="150" stroke="#FFFFFF" stroke-width="1" opacity="0.12" fill="none"/>

  <!-- Row of green dots, all "fine" -->
  <g fill="#7ED957">
    <circle cx="460" cy="230" r="20"/>
    <circle cx="540" cy="230" r="20"/>
    <circle cx="620" cy="230" r="20"/>
    <circle cx="700" cy="230" r="20"/>
    <circle cx="780" cy="230" r="20"/>
  </g>
  <!-- Dust/cobweb-like faded dashes under them, "nobody's watching" -->
  <g stroke="#8CC2FF" stroke-width="1.5" opacity="0.3" stroke-dasharray="4 5">
    <line x1="460" y1="260" x2="460" y2="330"/>
    <line x1="540" y1="260" x2="540" y2="330"/>
    <line x1="620" y1="260" x2="620" y2="330"/>
    <line x1="700" y1="260" x2="700" y2="330"/>
    <line x1="780" y1="260" x2="780" y2="330"/>
  </g>
  <text x="600" y="370" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" fill="#8CC2FF" opacity="0.6">last updated: unknown</text>

  <g transform="translate(460, 480)">
    <rect x="0" y="0" width="280" height="70" rx="14" fill="#132C52" stroke="#4DA3FF" stroke-width="2"/>
    <text x="140" y="30" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#8CC2FF" letter-spacing="1">THE BETTER QUESTION</text>
    <text x="140" y="56" text-anchor="middle" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">When was this updated?</text>
  </g>
</svg>
