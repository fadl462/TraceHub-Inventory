<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg30" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A1F3A"/><stop offset="1" stop-color="#1A4D8F"/>
    </linearGradient>
    <radialGradient id="glow30" cx="50%" cy="38%" r="55%">
      <stop offset="0" stop-color="#4DA3FF" stop-opacity="0.30"/><stop offset="1" stop-color="#4DA3FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg30)"/>
  <circle cx="600" cy="230" r="280" fill="url(#glow30)"/>
  <circle cx="600" cy="300" r="230" stroke="#FFFFFF" stroke-width="1" opacity="0.08" fill="none"/>
  <circle cx="600" cy="300" r="150" stroke="#FFFFFF" stroke-width="1" opacity="0.12" fill="none"/>

  <!-- Four horizon markers on an arc -->
  <path d="M 400 320 A 200 200 0 0 1 800 320" fill="none" stroke="#132C52" stroke-width="20" stroke-linecap="round"/>
  <path d="M 400 320 A 200 200 0 0 1 640 130" fill="none" stroke="#FF8A65" stroke-width="20" stroke-linecap="round"/>
  <circle cx="400" cy="320" r="8" fill="#8CC2FF"/>
  <circle cx="480" cy="200" r="8" fill="#8CC2FF"/>
  <circle cx="600" cy="150" r="8" fill="#8CC2FF"/>
  <circle cx="720" cy="200" r="8" fill="#FF8A65"/>
  <text x="400" y="350" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#8CC2FF">30d</text>
  <text x="600" y="120" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#8CC2FF">90d</text>
  <text x="820" y="330" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#FF8A65">180d</text>

  <text x="600" y="270" text-anchor="middle" font-family="Inter, sans-serif" font-size="52" font-weight="700" fill="#FFFFFF">35%</text>

  <g transform="translate(460, 480)">
    <rect x="0" y="0" width="280" height="70" rx="14" fill="#132C52" stroke="#4DA3FF" stroke-width="2"/>
    <text x="140" y="30" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#8CC2FF" letter-spacing="1">WHAT ALSO MATTERS</text>
    <text x="140" y="56" text-anchor="middle" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Which horizon</text>
  </g>
</svg>
