<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg12" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A1F3A"/>
      <stop offset="1" stop-color="#1A4D8F"/>
    </linearGradient>
    <radialGradient id="glow12" cx="50%" cy="38%" r="55%">
      <stop offset="0" stop-color="#4DA3FF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#4DA3FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg12)"/>
  <circle cx="600" cy="230" r="280" fill="url(#glow12)"/>
  <circle cx="600" cy="300" r="230" stroke="#FFFFFF" stroke-width="1" opacity="0.08" fill="none"/>
  <circle cx="600" cy="300" r="150" stroke="#FFFFFF" stroke-width="1" opacity="0.12" fill="none"/>

  <!-- Leaf shape -->
  <g transform="translate(600, 250)">
    <path d="M 0 -110 C 80 -100 110 -20 60 60 C 30 105 -30 105 -60 60 C -110 -20 -80 -100 0 -110 Z"
          fill="#132C52" stroke="#7ED957" stroke-width="4"/>
    <path d="M 0 -105 L 0 95" stroke="#7ED957" stroke-width="3" opacity="0.6"/>
    <path d="M 0 -50 L -35 -15" stroke="#7ED957" stroke-width="2" opacity="0.5"/>
    <path d="M 0 0 L 35 35" stroke="#7ED957" stroke-width="2" opacity="0.5"/>
    <path d="M 0 40 L -30 70" stroke="#7ED957" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- Small data bars overlapping, "asset-level data" motif -->
  <g transform="translate(790, 300)">
    <rect x="-10" y="-30" width="18" height="60" rx="4" fill="#0A1F3A" stroke="#8CC2FF" stroke-width="2.5"/>
    <rect x="14" y="-55" width="18" height="85" rx="4" fill="#0A1F3A" stroke="#8CC2FF" stroke-width="2.5"/>
    <rect x="38" y="-15" width="18" height="45" rx="4" fill="#0A1F3A" stroke="#8CC2FF" stroke-width="2.5"/>
  </g>

  <g transform="translate(460, 480)">
    <rect x="0" y="0" width="280" height="70" rx="14" fill="#132C52" stroke="#4DA3FF" stroke-width="2"/>
    <text x="140" y="30" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#8CC2FF" letter-spacing="1">CAN'T TRACK PER-VEHICLE EMISSIONS</text>
    <text x="140" y="56" text-anchor="middle" font-family="Inter, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">68% of fleets</text>
  </g>
