<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg35" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A1F3A"/><stop offset="1" stop-color="#1A4D8F"/>
    </linearGradient>
    <radialGradient id="glow35" cx="50%" cy="38%" r="55%">
      <stop offset="0" stop-color="#4DA3FF" stop-opacity="0.30"/><stop offset="1" stop-color="#4DA3FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg35)"/>
  <circle cx="600" cy="230" r="280" fill="url(#glow35)"/>
  <circle cx="600" cy="300" r="230" stroke="#FFFFFF" stroke-width="1" opacity="0.08" fill="none"/>
  <circle cx="600" cy="300" r="150" stroke="#FFFFFF" stroke-width="1" opacity="0.12" fill="none"/>

  <!-- Circular loop of 3 nodes -->
  <g font-family="Inter, sans-serif">
    <circle cx="600" cy="180" r="46" fill="#132C52" stroke="#FF8A65" stroke-width="3.5"/>
    <text x="600" y="186" text-anchor="middle" font-size="12" fill="#FF8A65" font-weight="700">REJECTED</text>

    <circle cx="460" cy="330" r="46" fill="#0A1F3A" stroke="#8CC2FF" stroke-width="3.5"/>
    <text x="460" y="326" text-anchor="middle" font-size="11" fill="#8CC2FF" font-weight="700">30 DAYS</text>
    <text x="460" y="340" text-anchor="middle" font-size="11" fill="#8CC2FF" font-weight="700">LATER</text>

    <circle cx="740" cy="330" r="46" fill="#0A1F3A" stroke="#7ED957" stroke-width="3.5"/>
    <text x="740" y="326" text-anchor="middle" font-size="11" fill="#7ED957" font-weight="700">RELIABILITY</text>
    <text x="740" y="340" text-anchor="middle" font-size="11" fill="#7ED957" font-weight="700">RATE</text>

    <path d="M 570 210 L 490 300" fill="none" stroke="#8CC2FF" stroke-width="2.5" marker-end="url(#arrowR)"/>
    <path d="M 505 340 L 695 340" fill="none" stroke="#8CC2FF" stroke-width="2.5" marker-end="url(#arrowR)"/>
    <path d="M 715 300 L 630 210" fill="none" stroke="#7ED957" stroke-width="2.5" marker-end="url(#arrowR)"/>
  </g>
  <defs><marker id="arrowR" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#8CC2FF" stroke-width="2"/></marker></defs>

  <g transform="translate(460, 480)">
    <rect x="0" y="0" width="280" height="70" rx="14" fill="#132C52" stroke="#4DA3FF" stroke-width="2"/>
    <text x="140" y="30" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#8CC2FF" letter-spacing="1">WHAT IT'S LEARNING FROM</text>
    <text x="140" y="56" text-anchor="middle" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Your own decisions</text>
  </g>
</svg>
