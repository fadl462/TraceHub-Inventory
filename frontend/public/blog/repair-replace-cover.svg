<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A1F3A"/>
      <stop offset="1" stop-color="#1A4D8F"/>
    </linearGradient>
    <radialGradient id="glow2" cx="50%" cy="38%" r="55%">
      <stop offset="0" stop-color="#4DA3FF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#4DA3FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg2)"/>
  <circle cx="600" cy="230" r="280" fill="url(#glow2)"/>

  <!-- dotted radar rings, faint, behind the scale -->
  <circle cx="600" cy="300" r="230" stroke="#FFFFFF" stroke-width="1" opacity="0.08" fill="none"/>
  <circle cx="600" cy="300" r="150" stroke="#FFFFFF" stroke-width="1" opacity="0.12" fill="none"/>

  <!-- Balance scale: central post -->
  <rect x="592" y="180" width="16" height="230" rx="4" fill="#132C52" stroke="#4DA3FF" stroke-width="2"/>
  <rect x="520" y="392" width="160" height="20" rx="6" fill="#132C52" stroke="#4DA3FF" stroke-width="2"/>

  <!-- Tilted beam (slightly favoring "replace" side, matching the article's worked example) -->
  <g transform="rotate(-7 600 195)">
    <rect x="280" y="185" width="640" height="12" rx="6" fill="#8CC2FF"/>

    <!-- Left pan: Repair (wrench) -->
    <line x1="320" y1="197" x2="320" y2="280" stroke="#8CC2FF" stroke-width="3"/>
    <line x1="380" y1="197" x2="380" y2="280" stroke="#8CC2FF" stroke-width="3"/>
    <path d="M 300 280 Q 350 320 400 280 L 400 288 Q 350 328 300 288 Z" fill="#132C52" stroke="#4DA3FF" stroke-width="2.5"/>
    <g transform="translate(325, 240)">
      <circle cx="18" cy="18" r="17" fill="#0A1F3A" stroke="#7ED957" stroke-width="2.5"/>
      <path d="M 10 24 L 20 14 M 22 12 A 5 5 0 1 1 14 20" stroke="#7ED957" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Right pan: Replace (fresh unit, plus sign) -->
    <line x1="820" y1="197" x2="820" y2="280" stroke="#8CC2FF" stroke-width="3"/>
    <line x1="880" y1="197" x2="880" y2="280" stroke="#8CC2FF" stroke-width="3"/>
    <path d="M 800 280 Q 850 320 900 280 L 900 288 Q 850 328 800 288 Z" fill="#132C52" stroke="#4DA3FF" stroke-width="2.5"/>
    <g transform="translate(825, 240)">
      <rect x="0" y="0" width="36" height="36" rx="8" fill="#0A1F3A" stroke="#7ED957" stroke-width="2.5"/>
      <line x1="18" y1="9" x2="18" y2="27" stroke="#7ED957" stroke-width="3" stroke-linecap="round"/>
      <line x1="9" y1="18" x2="27" y2="18" stroke="#7ED957" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Score readout badge -->
  <g transform="translate(505, 470)">
    <rect x="0" y="0" width="190" height="70" rx="14" fill="#132C52" stroke="#4DA3FF" stroke-width="2"/>
    <text x="95" y="30" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#8CC2FF" letter-spacing="1">DISPOSAL READINESS</text>
    <text x="95" y="56" text-anchor="middle" font-family="Inter, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">72%</text>
  </g>
</svg>
