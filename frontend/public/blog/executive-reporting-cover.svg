<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgER" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A1F3A"/>
      <stop offset="1" stop-color="#1A4D8F"/>
    </linearGradient>
    <radialGradient id="glowER" cx="50%" cy="38%" r="55%">
      <stop offset="0" stop-color="#4DA3FF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#4DA3FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgER)"/>
  <circle cx="600" cy="230" r="280" fill="url(#glowER)"/>
  <circle cx="600" cy="300" r="230" stroke="#FFFFFF" stroke-width="1" opacity="0.08" fill="none"/>
  <circle cx="600" cy="300" r="150" stroke="#FFFFFF" stroke-width="1" opacity="0.12" fill="none"/>

  <!-- Cluttered detailed panel, left, faded -->
  <g transform="translate(430, 260)" opacity="0.4">
    <rect x="-90" y="-90" width="180" height="180" rx="12" fill="#132C52" stroke="#8CC2FF" stroke-width="2"/>
    <line x1="-70" y1="-60" x2="70" y2="-60" stroke="#8CC2FF" stroke-width="3"/>
    <line x1="-70" y1="-35" x2="70" y2="-35" stroke="#8CC2FF" stroke-width="3"/>
    <line x1="-70" y1="-10" x2="70" y2="-10" stroke="#8CC2FF" stroke-width="3"/>
    <line x1="-70" y1="15" x2="70" y2="15" stroke="#8CC2FF" stroke-width="3"/>
    <line x1="-70" y1="40" x2="40" y2="40" stroke="#8CC2FF" stroke-width="3"/>
    <line x1="-70" y1="65" x2="30" y2="65" stroke="#8CC2FF" stroke-width="3"/>
  </g>

  <path d="M 550 260 L 640 260" stroke="#7ED957" stroke-width="3" stroke-dasharray="6 5"/>
  <path d="M 625 250 L 645 260 L 625 270" fill="none" stroke="#7ED957" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Single clean number, right -->
  <g transform="translate(800, 260)">
    <circle r="90" fill="#0A1F3A" stroke="#7ED957" stroke-width="4"/>
    <text x="0" y="10" text-anchor="middle" font-family="Inter, sans-serif" font-size="42" font-weight="700" fill="#FFFFFF">12%</text>
    <text x="0" y="36" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#7ED957">AT RISK</text>
  </g>

  <g transform="translate(460, 480)">
    <rect x="0" y="0" width="280" height="70" rx="14" fill="#132C52" stroke="#4DA3FF" stroke-width="2"/>
    <text x="140" y="30" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#8CC2FF" letter-spacing="1">BRING TO THE EXEC MEETING</text>
    <text x="140" y="56" text-anchor="middle" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">One number</text>
  </g>
</svg>
