<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg7" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A1F3A"/>
      <stop offset="1" stop-color="#1A4D8F"/>
    </linearGradient>
    <radialGradient id="glow7" cx="50%" cy="38%" r="55%">
      <stop offset="0" stop-color="#4DA3FF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#4DA3FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg7)"/>
  <circle cx="600" cy="230" r="280" fill="url(#glow7)"/>
  <circle cx="600" cy="300" r="230" stroke="#FFFFFF" stroke-width="1" opacity="0.08" fill="none"/>
  <circle cx="600" cy="300" r="150" stroke="#FFFFFF" stroke-width="1" opacity="0.12" fill="none"/>

  <!-- Connections between 3 location pins -->
  <line x1="420" y1="290" x2="600" y2="180" stroke="#4DA3FF" stroke-width="2.5" stroke-dasharray="6 6" opacity="0.6"/>
  <line x1="600" y1="180" x2="800" y2="300" stroke="#4DA3FF" stroke-width="2.5" stroke-dasharray="6 6" opacity="0.6"/>
  <line x1="420" y1="290" x2="800" y2="300" stroke="#4DA3FF" stroke-width="2.5" stroke-dasharray="6 6" opacity="0.4"/>

  <!-- Pin 1 -->
  <g transform="translate(420, 250)">
    <path d="M0 0 C -26 0 -26 -40 0 -40 C 26 -40 26 0 0 0 Z" fill="#132C52" stroke="#8CC2FF" stroke-width="3"/>
    <circle cx="0" cy="-24" r="9" fill="#8CC2FF"/>
  </g>
  <!-- Pin 2, highlighted as "main" -->
  <g transform="translate(600, 130)">
    <path d="M0 0 C -30 0 -30 -46 0 -46 C 30 -46 30 0 0 0 Z" fill="#0A1F3A" stroke="#7ED957" stroke-width="4"/>
    <circle cx="0" cy="-27" r="10" fill="#7ED957"/>
  </g>
  <!-- Pin 3 -->
  <g transform="translate(800, 260)">
    <path d="M0 0 C -26 0 -26 -40 0 -40 C 26 -40 26 0 0 0 Z" fill="#132C52" stroke="#8CC2FF" stroke-width="3"/>
    <circle cx="0" cy="-24" r="9" fill="#8CC2FF"/>
  </g>

  <g transform="translate(480, 470)">
    <rect x="0" y="0" width="240" height="70" rx="14" fill="#132C52" stroke="#4DA3FF" stroke-width="2"/>
    <text x="120" y="30" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#8CC2FF" letter-spacing="1">LOCATIONS TRACKED</text>
    <text x="120" y="56" text-anchor="middle" font-family="Inter, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">Unlimited</text>
  </g>
