<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgDC" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A1F3A"/>
      <stop offset="1" stop-color="#1A4D8F"/>
    </linearGradient>
    <radialGradient id="glowDC" cx="50%" cy="38%" r="55%">
      <stop offset="0" stop-color="#4DA3FF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#4DA3FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgDC)"/>
  <circle cx="600" cy="230" r="280" fill="url(#glowDC)"/>
  <circle cx="600" cy="300" r="230" stroke="#FFFFFF" stroke-width="1" opacity="0.08" fill="none"/>
  <circle cx="600" cy="300" r="150" stroke="#FFFFFF" stroke-width="1" opacity="0.12" fill="none"/>

  <!-- Iceberg: small tip visible, large body below waterline -->
  <line x1="380" y1="280" x2="900" y2="280" stroke="#8CC2FF" stroke-width="2" opacity="0.4" stroke-dasharray="8 6"/>
  <path d="M 600 200 L 640 280 L 560 280 Z" fill="#7ED957" stroke="#7ED957" stroke-width="2"/>
  <path d="M 560 280 L 640 280 L 720 400 L 480 400 Z" fill="#132C52" stroke="#8CC2FF" stroke-width="3" opacity="0.85"/>

  <text x="600" y="240" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#0A1F3A" font-weight="700">REPAIR</text>
  <text x="600" y="345" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#8CC2FF" font-weight="600">LOST TIME, SUBSTITUTES,</text>
  <text x="600" y="365" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#8CC2FF" font-weight="600">SLIPPED SCHEDULES</text>

  <g transform="translate(460, 480)">
    <rect x="0" y="0" width="280" height="70" rx="14" fill="#132C52" stroke="#4DA3FF" stroke-width="2"/>
    <text x="140" y="30" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#8CC2FF" letter-spacing="1">USUALLY THE</text>
    <text x="140" y="56" text-anchor="middle" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">Smallest number</text>
  </g>
</svg>
