<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg9" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A1F3A"/>
      <stop offset="1" stop-color="#1A4D8F"/>
    </linearGradient>
    <radialGradient id="glow9" cx="50%" cy="38%" r="55%">
      <stop offset="0" stop-color="#4DA3FF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#4DA3FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg9)"/>
  <circle cx="600" cy="230" r="280" fill="url(#glow9)"/>
  <circle cx="600" cy="300" r="230" stroke="#FFFFFF" stroke-width="1" opacity="0.08" fill="none"/>
  <circle cx="600" cy="300" r="150" stroke="#FFFFFF" stroke-width="1" opacity="0.12" fill="none"/>

  <!-- Barcode -->
  <g transform="translate(330, 220)">
    <rect x="-60" y="-50" width="120" height="100" rx="12" fill="#132C52" stroke="#8CC2FF" stroke-width="2.5"/>
    <g fill="#8CC2FF">
      <rect x="-40" y="-25" width="4" height="50"/><rect x="-30" y="-25" width="8" height="50"/>
      <rect x="-14" y="-25" width="4" height="50"/><rect x="-4" y="-25" width="10" height="50"/>
      <rect x="14" y="-25" width="4" height="50"/><rect x="24" y="-25" width="6" height="50"/>
    </g>
    <text x="0" y="80" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#8CC2FF">Barcode</text>
  </g>

  <!-- QR code, highlighted as the chosen answer -->
  <g transform="translate(600, 210)">
    <rect x="-70" y="-70" width="140" height="140" rx="14" fill="#0A1F3A" stroke="#7ED957" stroke-width="4"/>
    <g fill="#7ED957">
      <rect x="-50" y="-50" width="22" height="22"/><rect x="28" y="-50" width="22" height="22"/>
      <rect x="-50" y="28" width="22" height="22"/><rect x="-14" y="-14" width="16" height="16"/>
      <rect x="12" y="-14" width="10" height="10"/><rect x="-14" y="12" width="10" height="10"/>
    </g>
    <text x="0" y="98" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" fill="#7ED957" font-weight="700">QR Code</text>
  </g>

  <!-- RFID waves -->
  <g transform="translate(870, 220)">
    <rect x="-45" y="-40" width="90" height="60" rx="10" fill="#132C52" stroke="#8CC2FF" stroke-width="2.5"/>
    <circle cx="0" cy="-10" r="4" fill="#8CC2FF"/>
    <path d="M -15 -10 A 15 15 0 0 1 15 -10" fill="none" stroke="#8CC2FF" stroke-width="3" opacity="0.7"/>
    <path d="M -28 -10 A 28 28 0 0 1 28 -10" fill="none" stroke="#8CC2FF" stroke-width="3" opacity="0.4"/>
    <text x="0" y="80" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#8CC2FF">RFID</text>
  </g>

  <g transform="translate(480, 480)">
    <rect x="0" y="0" width="240" height="70" rx="14" fill="#132C52" stroke="#4DA3FF" stroke-width="2"/>
    <text x="120" y="30" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#8CC2FF" letter-spacing="1">HARDWARE REQUIRED</text>
    <text x="120" y="56" text-anchor="middle" font-family="Inter, sans-serif" font-size="24" font-weight="700" fill="#7ED957">None</text>
  </g>
</svg>
