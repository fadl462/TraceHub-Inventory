<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg23" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A1F3A"/>
      <stop offset="1" stop-color="#1A4D8F"/>
    </linearGradient>
    <radialGradient id="glow23" cx="50%" cy="38%" r="55%">
      <stop offset="0" stop-color="#4DA3FF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#4DA3FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg23)"/>
  <circle cx="600" cy="230" r="280" fill="url(#glow23)"/>
  <circle cx="600" cy="300" r="230" stroke="#FFFFFF" stroke-width="1" opacity="0.08" fill="none"/>
  <circle cx="600" cy="300" r="150" stroke="#FFFFFF" stroke-width="1" opacity="0.12" fill="none"/>

  <!-- Dial gauge -->
  <g transform="translate(600, 270)">
    <path d="M -110 20 A 110 110 0 1 1 110 20" fill="none" stroke="#132C52" stroke-width="22" stroke-linecap="round"/>
    <path d="M -110 20 A 110 110 0 0 1 40 -100" fill="none" stroke="#7ED957" stroke-width="22" stroke-linecap="round"/>
    <line x1="0" y1="20" x2="55" y2="-70" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
    <circle cx="0" cy="20" r="14" fill="#0A1F3A" stroke="#FFFFFF" stroke-width="3"/>
  </g>

  <!-- Small circular arrow, "revisit yearly" -->
  <g transform="translate(830, 320)">
    <path d="M -30 0 A 30 30 0 1 1 20 -22" fill="none" stroke="#8CC2FF" stroke-width="4" stroke-linecap="round"/>
    <path d="M 12 -32 L 20 -22 L 30 -30" fill="none" stroke="#8CC2FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(460, 480)">
    <rect x="0" y="0" width="280" height="70" rx="14" fill="#132C52" stroke="#4DA3FF" stroke-width="2"/>
    <text x="140" y="30" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#8CC2FF" letter-spacing="1">REASONABLE CHECK CADENCE</text>
    <text x="140" y="56" text-anchor="middle" font-family="Inter, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">Once a year</text>
  </g>
</svg>
