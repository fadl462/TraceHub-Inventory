<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg34" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A1F3A"/><stop offset="1" stop-color="#1A4D8F"/>
    </linearGradient>
    <radialGradient id="glow34" cx="50%" cy="38%" r="55%">
      <stop offset="0" stop-color="#4DA3FF" stop-opacity="0.30"/><stop offset="1" stop-color="#4DA3FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg34)"/>
  <circle cx="600" cy="230" r="280" fill="url(#glow34)"/>
  <circle cx="600" cy="300" r="230" stroke="#FFFFFF" stroke-width="1" opacity="0.08" fill="none"/>
  <circle cx="600" cy="300" r="150" stroke="#FFFFFF" stroke-width="1" opacity="0.12" fill="none"/>

  <!-- Messy tags, different sizes/rotations -->
  <g opacity="0.6" font-family="Inter, sans-serif" fill="#8CC2FF">
    <g transform="translate(470, 210) rotate(-8)"><rect x="-55" y="-16" width="110" height="32" rx="16" fill="none" stroke="#8CC2FF" stroke-width="2"/><text x="0" y="5" text-anchor="middle" font-size="12">FL-03</text></g>
    <g transform="translate(560, 260) rotate(6)"><rect x="-70" y="-16" width="140" height="32" rx="16" fill="none" stroke="#8CC2FF" stroke-width="2"/><text x="0" y="5" text-anchor="middle" font-size="12">yellow forklift</text></g>
    <g transform="translate(460, 310) rotate(-4)"><rect x="-75" y="-16" width="150" height="32" rx="16" fill="none" stroke="#8CC2FF" stroke-width="2"/><text x="0" y="5" text-anchor="middle" font-size="12">Toyota Forklift</text></g>
  </g>

  <path d="M 670 260 L 760 260" stroke="#7ED957" stroke-width="3" marker-end="url(#arrowN)"/>
  <defs><marker id="arrowN" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#7ED957" stroke-width="2"/></marker></defs>

  <!-- Single clean tag -->
  <g transform="translate(900, 260)">
    <rect x="-90" y="-20" width="180" height="40" rx="20" fill="#0A1F3A" stroke="#7ED957" stroke-width="3.5"/>
    <text x="0" y="6" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" fill="#7ED957" font-weight="700">Forklift-Toyota-03</text>
  </g>

  <g transform="translate(460, 480)">
    <rect x="0" y="0" width="280" height="70" rx="14" fill="#132C52" stroke="#4DA3FF" stroke-width="2"/>
    <text x="140" y="30" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#8CC2FF" letter-spacing="1">WHAT MATTERS MOST</text>
    <text x="140" y="56" text-anchor="middle" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">Consistency</text>
  </g>
</svg>
