<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg28" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A1F3A"/><stop offset="1" stop-color="#1A4D8F"/>
    </linearGradient>
    <radialGradient id="glow28" cx="50%" cy="38%" r="55%">
      <stop offset="0" stop-color="#4DA3FF" stop-opacity="0.30"/><stop offset="1" stop-color="#4DA3FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg28)"/>
  <circle cx="600" cy="230" r="280" fill="url(#glow28)"/>
  <circle cx="600" cy="300" r="230" stroke="#FFFFFF" stroke-width="1" opacity="0.08" fill="none"/>
  <circle cx="600" cy="300" r="150" stroke="#FFFFFF" stroke-width="1" opacity="0.12" fill="none"/>

  <!-- Grid, fading -->
  <g transform="translate(450, 270)" opacity="0.5">
    <rect x="-70" y="-70" width="140" height="140" rx="6" fill="none" stroke="#8CC2FF" stroke-width="2"/>
    <line x1="-70" y1="-23" x2="70" y2="-23" stroke="#8CC2FF" stroke-width="1.5"/>
    <line x1="-70" y1="23" x2="70" y2="23" stroke="#8CC2FF" stroke-width="1.5"/>
    <line x1="-23" y1="-70" x2="-23" y2="70" stroke="#8CC2FF" stroke-width="1.5"/>
    <line x1="23" y1="-70" x2="23" y2="70" stroke="#8CC2FF" stroke-width="1.5"/>
  </g>
  <path d="M 540 270 L 660 270" stroke="#7ED957" stroke-width="3" marker-end="url(#arrowG)"/>
  <defs><marker id="arrowG" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#7ED957" stroke-width="2"/></marker></defs>

  <!-- Live dial -->
  <g transform="translate(770, 270)">
    <circle r="75" fill="#0A1F3A" stroke="#7ED957" stroke-width="5"/>
    <path d="M -50 20 A 50 50 0 1 1 40 -35" fill="none" stroke="#7ED957" stroke-width="8" stroke-linecap="round"/>
    <text x="0" y="8" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">LIVE</text>
