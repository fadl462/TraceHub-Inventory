<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgOE" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A1F3A"/>
      <stop offset="1" stop-color="#1A4D8F"/>
    </linearGradient>
    <radialGradient id="glowOE" cx="50%" cy="38%" r="55%">
      <stop offset="0" stop-color="#4DA3FF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#4DA3FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgOE)"/>
  <circle cx="600" cy="230" r="280" fill="url(#glowOE)"/>
  <circle cx="600" cy="300" r="230" stroke="#FFFFFF" stroke-width="1" opacity="0.08" fill="none"/>
  <circle cx="600" cy="300" r="150" stroke="#FFFFFF" stroke-width="1" opacity="0.12" fill="none"/>

  <!-- Old gear/machine icon -->
  <g transform="translate(560, 260)">
    <circle r="80" fill="none" stroke="#8CC2FF" stroke-width="5"/>
    <g stroke="#8CC2FF" stroke-width="12" stroke-linecap="round">
      <line x1="0" y1="-80" x2="0" y2="-104"/><line x1="0" y1="80" x2="0" y2="104"/>
      <line x1="-80" y1="0" x2="-104" y2="0"/><line x1="80" y1="0" x2="104" y2="0"/>
    </g>
    <circle r="38" fill="#0A1F3A" stroke="#4DA3FF" stroke-width="3"/>
  </g>
  <!-- Question mark badge overlapping -->
  <g transform="translate(720, 350)">
    <circle r="48" fill="#132C52" stroke="#FF8A65" stroke-width="4"/>
    <text x="0" y="16" text-anchor="middle" font-family="Inter, sans-serif" font-size="42" font-weight="700" fill="#FF8A65">?</text>
  </g>

  <g transform="translate(460, 480)">
    <rect x="0" y="0" width="280" height="70" rx="14" fill="#132C52" stroke="#4DA3FF" stroke-width="2"/>
    <text x="140" y="30" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#8CC2FF" letter-spacing="1">STOPS BEING USEFUL AT</text>
    <text x="140" y="56" text-anchor="middle" font-family="Inter, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">Residual value</text>
  </g>
</svg>
