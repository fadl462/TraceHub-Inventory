<svg viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
  <text x="450" y="28" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#2C2C2C">What actually feeds the Disposal Readiness Score</text>

  <!-- Donut chart -->
  <g transform="translate(150, 60)">
    <!-- Segments as stroked circle arcs, circumference-based dasharray on r=70 (C = 439.8) -->
    <circle cx="90" cy="90" r="70" fill="none" stroke="#EAF1FA" stroke-width="34"/>
    <!-- Age 25% -->
    <circle cx="90" cy="90" r="70" fill="none" stroke="#1A4D8F" stroke-width="34"
      stroke-dasharray="109.95 329.85" stroke-dashoffset="0" transform="rotate(-90 90 90)"/>
    <!-- Maintenance cost 20% -->
    <circle cx="90" cy="90" r="70" fill="none" stroke="#4DA3FF" stroke-width="34"
      stroke-dasharray="87.96 351.84" stroke-dashoffset="-109.95" transform="rotate(-90 90 90)"/>
    <!-- Depreciation 15% -->
    <circle cx="90" cy="90" r="70" fill="none" stroke="#7ED957" stroke-width="34"
      stroke-dasharray="65.97 373.83" stroke-dashoffset="-197.91" transform="rotate(-90 90 90)"/>
    <!-- Repair frequency 15% -->
    <circle cx="90" cy="90" r="70" fill="none" stroke="#F4A261" stroke-width="34"
      stroke-dasharray="65.97 373.83" stroke-dashoffset="-263.88" transform="rotate(-90 90 90)"/>
    <!-- Health 10% -->
    <circle cx="90" cy="90" r="70" fill="none" stroke="#94A3B8" stroke-width="34"
      stroke-dasharray="43.98 395.82" stroke-dashoffset="-329.85" transform="rotate(-90 90 90)"/>
    <!-- Market value 10% -->
    <circle cx="90" cy="90" r="70" fill="none" stroke="#5CB93A" stroke-width="34"
      stroke-dasharray="43.98 395.82" stroke-dashoffset="-373.83" transform="rotate(-90 90 90)"/>
    <!-- Criticality 5% -->
    <circle cx="90" cy="90" r="70" fill="none" stroke="#0A1F3A" stroke-width="34"
      stroke-dasharray="21.99 417.81" stroke-dashoffset="-417.81" transform="rotate(-90 90 90)"/>
  </g>

  <!-- Legend -->
  <g font-family="Inter, sans-serif" font-size="13.5" fill="#2C2C2C">
    <g transform="translate(430, 55)">
      <rect width="14" height="14" rx="3" fill="#1A4D8F"/>
      <text x="22" y="12">Age relative to useful life \u2014 25%</text>
    </g>
    <g transform="translate(430, 84)">
      <rect width="14" height="14" rx="3" fill="#4DA3FF"/>
      <text x="22" y="12">Maintenance cost vs. replacement value \u2014 20%</text>
    </g>
    <g transform="translate(430, 113)">
      <rect width="14" height="14" rx="3" fill="#7ED957"/>
      <text x="22" y="12">Depreciation \u2014 15%</text>
    </g>
    <g transform="translate(430, 142)">
      <rect width="14" height="14" rx="3" fill="#F4A261"/>
      <text x="22" y="12">Repair frequency \u2014 15%</text>
    </g>
    <g transform="translate(430, 171)">
      <rect width="14" height="14" rx="3" fill="#94A3B8"/>
      <text x="22" y="12">Health score \u2014 10%</text>
    </g>
    <g transform="translate(430, 200)">
      <rect width="14" height="14" rx="3" fill="#5CB93A"/>
      <text x="22" y="12">Current market value \u2014 10%</text>
    </g>
    <g transform="translate(430, 229)">
      <rect width="14" height="14" rx="3" fill="#0A1F3A"/>
      <text x="22" y="12">Business criticality \u2014 5%</text>
    </g>
  </g>

  <text x="450" y="300" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#2C2C2C" opacity="0.5">The real weights behind TraceHub's Disposal Intelligence Engine \u2014 not illustrative, the actual scoring model.</text>
</svg>
