<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgSE" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A1F3A"/>
      <stop offset="1" stop-color="#1A4D8F"/>
    </linearGradient>
    <radialGradient id="glowSE" cx="50%" cy="38%" r="55%">
      <stop offset="0" stop-color="#4DA3FF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#4DA3FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgSE)"/>
  <circle cx="600" cy="230" r="280" fill="url(#glowSE)"/>
  <circle cx="600" cy="300" r="230" stroke="#FFFFFF" stroke-width="1" opacity="0.08" fill="none"/>
  <circle cx="600" cy="300" r="150" stroke="#FFFFFF" stroke-width="1" opacity="0.12" fill="none"/>

  <!-- A year bar with active/inactive segments -->
  <rect x="350" y="270" width="500" height="60" rx="10" fill="#132C52" stroke="#4DA3FF" stroke-width="2.5"/>
  <rect x="350" y="270" width="120" height="60" rx="10" fill="#7ED957" opacity="0.85"/>
  <rect x="470" y="270" width="230" height="60" fill="#132C52"/>
  <rect x="700" y="270" width="150" height="60" rx="10" fill="#132C52" stroke="#8CC2FF" stroke-width="2" stroke-dasharray="6 5" opacity="0.5"/>

  <text x="410" y="360" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#7ED957" font-weight="700">IN USE</text>
  <text x="585" y="360" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#8CC2FF" opacity="0.6">OFF-SEASON</text>

  <g transform="translate(460, 480)">
    <rect x="0" y="0" width="280" height="70" rx="14" fill="#132C52" stroke="#4DA3FF" stroke-width="2"/>
    <text x="140" y="30" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#8CC2FF" letter-spacing="1">BEST DEPRECIATION FIT</text>
    <text x="140" y="56" text-anchor="middle" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">Usage-based</text>
  </g>
</svg>
