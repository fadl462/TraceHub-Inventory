<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg32" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A1F3A"/><stop offset="1" stop-color="#1A4D8F"/>
    </linearGradient>
    <radialGradient id="glow32" cx="50%" cy="38%" r="55%">
      <stop offset="0" stop-color="#4DA3FF" stop-opacity="0.30"/><stop offset="1" stop-color="#4DA3FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg32)"/>
  <circle cx="600" cy="230" r="280" fill="url(#glow32)"/>
  <circle cx="600" cy="300" r="230" stroke="#FFFFFF" stroke-width="1" opacity="0.08" fill="none"/>
  <circle cx="600" cy="300" r="150" stroke="#FFFFFF" stroke-width="1" opacity="0.12" fill="none"/>

  <!-- Growing stack of note cards, "later" pile -->
  <g>
    <rect x="500" y="330" width="200" height="40" rx="6" fill="#132C52" stroke="#8CC2FF" stroke-width="2.5"/>
    <rect x="510" y="290" width="180" height="40" rx="6" fill="#132C52" stroke="#8CC2FF" stroke-width="2.5"/>
    <rect x="520" y="250" width="160" height="40" rx="6" fill="#132C52" stroke="#8CC2FF" stroke-width="2.5"/>
    <rect x="530" y="210" width="140" height="40" rx="6" fill="#0A1F3A" stroke="#FF8A65" stroke-width="3"/>
    <text x="600" y="235" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#FF8A65" font-weight="600">"later"</text>
  </g>
  <!-- Small clock, ticking -->
  <g transform="translate(800, 240)">
    <circle r="40" fill="#0A1F3A" stroke="#8CC2FF" stroke-width="3.5"/>
    <line x1="0" y1="0" x2="0" y2="-22" stroke="#8CC2FF" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="15" y2="10" stroke="#8CC2FF" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g transform="translate(460, 480)">
    <rect x="0" y="0" width="280" height="70" rx="14" fill="#132C52" stroke="#4DA3FF" stroke-width="2"/>
    <text x="140" y="30" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#8CC2FF" letter-spacing="1">WHAT ACTUALLY BREAKS THE PATTERN</text>
    <text x="140" y="56" text-anchor="middle" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">No gap to defer</text>
  </g>
</svg>
