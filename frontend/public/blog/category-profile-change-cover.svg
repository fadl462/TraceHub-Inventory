<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgCP" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A1F3A"/>
      <stop offset="1" stop-color="#1A4D8F"/>
    </linearGradient>
    <radialGradient id="glowCP" cx="50%" cy="38%" r="55%">
      <stop offset="0" stop-color="#4DA3FF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#4DA3FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgCP)"/>
  <circle cx="600" cy="230" r="280" fill="url(#glowCP)"/>
  <circle cx="600" cy="300" r="230" stroke="#FFFFFF" stroke-width="1" opacity="0.08" fill="none"/>
  <circle cx="600" cy="300" r="150" stroke="#FFFFFF" stroke-width="1" opacity="0.12" fill="none"/>

  <!-- Central category node -->
  <circle cx="600" cy="210" r="46" fill="#0A1F3A" stroke="#7ED957" stroke-width="4"/>
  <text x="600" y="217" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#7ED957" font-weight="700">CATEGORY</text>

  <!-- Ripple lines to multiple assets -->
  <g stroke="#8CC2FF" stroke-width="2" stroke-dasharray="5 5" opacity="0.5">
    <line x1="565" y1="245" x2="440" y2="340"/>
    <line x1="600" y1="256" x2="600" y2="340"/>
    <line x1="635" y1="245" x2="760" y2="340"/>
  </g>
  <g>
    <rect x="405" y="340" width="70" height="55" rx="8" fill="#132C52" stroke="#8CC2FF" stroke-width="2.5"/>
    <rect x="565" y="340" width="70" height="55" rx="8" fill="#132C52" stroke="#8CC2FF" stroke-width="2.5"/>
    <rect x="725" y="340" width="70" height="55" rx="8" fill="#132C52" stroke="#8CC2FF" stroke-width="2.5"/>
  </g>

  <g transform="translate(460, 480)">
    <rect x="0" y="0" width="280" height="70" rx="14" fill="#132C52" stroke="#4DA3FF" stroke-width="2"/>
    <text x="140" y="30" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#8CC2FF" letter-spacing="1">ONE EDIT, RECALCULATED</text>
    <text x="140" y="56" text-anchor="middle" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">Every asset</text>
  </g>
</svg>
