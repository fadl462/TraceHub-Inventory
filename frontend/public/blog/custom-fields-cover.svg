<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg21" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A1F3A"/>
      <stop offset="1" stop-color="#1A4D8F"/>
    </linearGradient>
    <radialGradient id="glow21" cx="50%" cy="38%" r="55%">
      <stop offset="0" stop-color="#4DA3FF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#4DA3FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg21)"/>
  <circle cx="600" cy="230" r="280" fill="url(#glow21)"/>
  <circle cx="600" cy="300" r="230" stroke="#FFFFFF" stroke-width="1" opacity="0.08" fill="none"/>
  <circle cx="600" cy="300" r="150" stroke="#FFFFFF" stroke-width="1" opacity="0.12" fill="none"/>

  <!-- Form panel -->
  <rect x="450" y="150" width="300" height="260" rx="16" fill="#132C52" stroke="#4DA3FF" stroke-width="3"/>
  <g stroke="#8CC2FF" stroke-width="3" opacity="0.5">
    <line x1="480" y1="200" x2="720" y2="200"/>
    <line x1="480" y1="245" x2="720" y2="245"/>
    <line x1="480" y1="290" x2="720" y2="290"/>
  </g>
  <!-- The added custom field, highlighted -->
  <rect x="470" y="325" width="260" height="40" rx="8" fill="#0A1F3A" stroke="#7ED957" stroke-width="3"/>
  <line x1="490" y1="345" x2="650" y2="345" stroke="#7ED957" stroke-width="3"/>
  <circle cx="695" cy="345" r="12" fill="#7ED957"/>
  <path d="M 690 345 L 693 348 L 700 340" fill="none" stroke="#0A1F3A" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Plus icon floating above, "add a field" -->
  <g transform="translate(700, 175)">
    <circle r="24" fill="#0A1F3A" stroke="#7ED957" stroke-width="3"/>
    <line x1="-11" y1="0" x2="11" y2="0" stroke="#7ED957" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="0" y1="-11" x2="0" y2="11" stroke="#7ED957" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <g transform="translate(460, 480)">
    <rect x="0" y="0" width="280" height="70" rx="14" fill="#132C52" stroke="#4DA3FF" stroke-width="2"/>
    <text x="140" y="30" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#8CC2FF" letter-spacing="1">THE RIGHT NUMBER OF FIELDS</text>
    <text x="140" y="56" text-anchor="middle" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Not one more</text>
  </g>
</svg>
