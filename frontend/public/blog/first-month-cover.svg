  <circle cx="360" cy="260" r="6" fill="#FF8A65"/>
  <circle cx="900" cy="276" r="7" fill="#7ED957"/>

  <text x="380" y="410" font-family="Inter, sans-serif" font-size="14" fill="#8CC2FF" opacity="0.7">Month 1</text>
  <text x="855" y="410" font-family="Inter, sans-serif" font-size="14" fill="#8CC2FF" opacity="0.7">Month 3</text>

  <g transform="translate(460, 480)">
