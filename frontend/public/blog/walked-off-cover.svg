<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg13" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A1F3A"/>
      <stop offset="1" stop-color="#1A4D8F"/>
    </linearGradient>
    <radialGradient id="glow13" cx="50%" cy="38%" r="55%">
      <stop offset="0" stop-color="#4DA3FF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#4DA3FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg13)"/>
  <circle cx="600" cy="230" r="280" fill="url(#glow13)"/>
  <circle cx="600" cy="300" r="230" stroke="#FFFFFF" stroke-width="1" opacity="0.08" fill="none"/>
  <circle cx="600" cy="300" r="150" stroke="#FFFFFF" stroke-width="1" opacity="0.12" fill="none"/>

  <!-- Solid wrench, left -->
  <g transform="translate(430, 260) rotate(-30)">
    <path d="M -70 -18 A 26 26 0 1 1 -70 18 L -20 4 L -20 -4 Z" fill="#132C52" stroke="#8CC2FF" stroke-width="3.5"/>
    <rect x="-20" y="-9" width="90" height="18" rx="6" fill="#132C52" stroke="#8CC2FF" stroke-width="3.5"/>
  </g>

  <!-- Dotted "missing" outline wrench, right, fading -->
  <g transform="translate(790, 260) rotate(-30)" opacity="0.55">
    <path d="M -70 -18 A 26 26 0 1 1 -70 18 L -20 4 L -20 -4 Z" fill="none" stroke="#8CC2FF" stroke-width="3" stroke-dasharray="6 6"/>
    <rect x="-20" y="-9" width="90" height="18" rx="6" fill="none" stroke="#8CC2FF" stroke-width="3" stroke-dasharray="6 6"/>
  </g>
  <!-- Question mark over the dotted one -->
  <g transform="translate(790, 175)">
    <text x="0" y="0" text-anchor="middle" font-family="Inter, sans-serif" font-size="40" font-weight="700" fill="#FF8A65">?</text>
  </g>

  <path d="M 500 260 L 700 260" stroke="#4DA3FF" stroke-width="2.5" stroke-dasharray="4 6" opacity="0.5"/>

  <g transform="translate(480, 480)">
    <rect x="0" y="0" width="240" height="70" rx="14" fill="#132C52" stroke="#4DA3FF" stroke-width="2"/>
    <text x="120" y="30" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#8CC2FF" letter-spacing="1">TIME TO LOG A HANDOFF</text>
    <text x="120" y="56" text-anchor="middle" font-family="Inter, sans-serif" font-size="24" font-weight="700" fill="#7ED957">~10 seconds</text>
  </g>
</svg>
