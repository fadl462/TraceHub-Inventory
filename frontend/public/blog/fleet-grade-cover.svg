<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg10" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A1F3A"/>
      <stop offset="1" stop-color="#1A4D8F"/>
    </linearGradient>
    <radialGradient id="glow10" cx="50%" cy="38%" r="55%">
      <stop offset="0" stop-color="#4DA3FF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#4DA3FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg10)"/>
  <circle cx="600" cy="230" r="280" fill="url(#glow10)"/>
  <circle cx="600" cy="300" r="230" stroke="#FFFFFF" stroke-width="1" opacity="0.08" fill="none"/>
  <circle cx="600" cy="300" r="150" stroke="#FFFFFF" stroke-width="1" opacity="0.12" fill="none"/>

  <!-- Big letter grade -->
  <circle cx="600" cy="245" r="90" fill="#132C52" stroke="#4DA3FF" stroke-width="4"/>
  <text x="600" y="285" text-anchor="middle" font-family="Inter, sans-serif" font-size="90" font-weight="700" fill="#FFFFFF">C</text>

  <!-- Three small gauges feeding into it -->
  <g font-family="Inter, sans-serif">
    <circle cx="370" cy="330" r="42" fill="#0A1F3A" stroke="#FF8A65" stroke-width="4"/>
    <text x="370" y="336" text-anchor="middle" font-size="12" fill="#FF8A65" font-weight="700">HEALTH</text>
    <line x1="410" y1="310" x2="530" y2="270" stroke="#8CC2FF" stroke-width="2" stroke-dasharray="5 5" opacity="0.6"/>

    <circle cx="600" cy="400" r="42" fill="#0A1F3A" stroke="#7ED957" stroke-width="4"/>
    <text x="600" y="406" text-anchor="middle" font-size="10.5" fill="#7ED957" font-weight="700">AVAILABILITY</text>
    <line x1="600" y1="358" x2="600" y2="336" stroke="#8CC2FF" stroke-width="2" stroke-dasharray="5 5" opacity="0.6"/>

    <circle cx="830" cy="330" r="42" fill="#0A1F3A" stroke="#8CC2FF" stroke-width="4"/>
    <text x="830" y="336" text-anchor="middle" font-size="12" fill="#8CC2FF" font-weight="700">CAPITAL</text>
    <line x1="790" y1="310" x2="670" y2="270" stroke="#8CC2FF" stroke-width="2" stroke-dasharray="5 5" opacity="0.6"/>
  </g>

  <g transform="translate(480, 480)">
    <rect x="0" y="0" width="240" height="70" rx="14" fill="#132C52" stroke="#4DA3FF" stroke-width="2"/>
    <text x="120" y="30" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#8CC2FF" letter-spacing="1">THREE REAL INPUTS</text>
    <text x="120" y="56" text-anchor="middle" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">One letter grade</text>
  </g>
</svg>
