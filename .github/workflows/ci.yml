name: TraceHub CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  backend:
    name: Backend - install, seed, boot check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create test .env
        run: |
          cp .env.example .env
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=ci_test_secret_$(openssl rand -hex 16)|" .env
          sed -i "s|^JWT_REFRESH_SECRET=.*|JWT_REFRESH_SECRET=ci_test_refresh_$(openssl rand -hex 16)|" .env

      - name: Run seed (schema sync + plans + categories + super admin)
        run: npm run seed

      - name: Boot the API and confirm /health responds
        run: |
          npm start &
          SERVER_PID=$!
          for i in {1..15}; do
            if curl -sf http://localhost:5000/health > /dev/null; then
              echo "API is healthy"
              kill $SERVER_PID
              exit 0
            fi
            sleep 1
          done
          echo "API failed to become healthy in time"
          kill $SERVER_PID || true
          exit 1

  frontend:
    name: Frontend - install and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create .env for build
        run: cp .env.example .env

      - name: Build production bundle
        run: npm run build
